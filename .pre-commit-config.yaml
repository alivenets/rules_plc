repos:
  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 8.5.1.3
    hooks:
      - id: buildifier
      - id: buildifier-lint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c]

  - repo: local
    hooks:
      - id: fmt-st
        name: fmt-st (tc3tools)
        entry: bazel run --noshow_progress //tools:fmt_st --
        language: system
        files: '\.st$'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    # .patch files are exact byte-for-byte diffs against upstream sources --
    # unified diff context lines representing a blank original line must
    # keep their single trailing space, which these hooks would otherwise
    # strip, corrupting the patch (breaks `patch`'s hunk parsing).
    - id: trailing-whitespace
      exclude: '\.patch$'
    - id: check-executables-have-shebangs
    - id: check-shebang-scripts-are-executable
    - id: end-of-file-fixer
      exclude: '\.patch$'
    - id: mixed-line-ending
      exclude: '\.patch$'
